<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar Bomba</title>
    <link rel="stylesheet" href="/bomba-js/css/style.css">

</head>
<body>
    <div class="grid"></div>
    
    <div class="warning"></div>

    <div class="base">
        <button id="activate">
            <span></span>
        </button>
    </div>

    <div class="box opened" id="cover">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <span></span><span></span>
    </div>

    <div class="hinges"></div>

    <div class="text">
        LOS-&thinsp;IDOS
    </div>

    <div id="panel">
        <div id="msg">DEVICE SELF-DESTRUCTION </div>
        <div id="time">7</div>
        <div id="abort">ABORT</div>
        <span id="detonate">DETONATE</span>
    </div>
    <div id="turn-off"></div>
    <div id="closing"></div>

    <div id="restart"><button id="reload"></button></div>

    <div id="mute"></div>

    <!-- <audio id="alarm" src="/bomba-js/sound/alarma.mp3"></audio>
    <audio id="alarm2" src="/bomba-js/sound/explosion.mp3"></audio>
    <script src="/bomba-js/prueba.js"></script> -->
    <audio id="alarm" src="./sound/alarma.mp3"></audio><audio id="alarm2" src="./sound/explosion.mp3"></audio><script src="./prueba.js"></script>
</body>
</html>
